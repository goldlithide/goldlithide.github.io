<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song Bracket</title>
<style>
:root{
  --bg:#f7f5f2; --fg:#201a24; --muted:#7a7080; --card:#ffffff; --border:#d9d3dc;
  --line:#b8afbd; --accent:#c2255c; --accentbg:#fde7ef; --hl:#ffe08a; --lose:#a79eac;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15111a; --fg:#f2eef5; --muted:#9d93a4; --card:#221c29; --border:#3a3243;
        --line:#4c4457; --accent:#ff6b9d; --accentbg:#3a1a2a; --hl:#7a5a00; --lose:#6f667a;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{font-size:17px;margin:0 8px 0 0;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.s:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#tabs{display:flex;gap:3px;align-items:flex-end;padding:8px 10px 0;background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
.tab{flex:none;max-width:240px;overflow:hidden;text-overflow:ellipsis;padding:6px 14px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;user-select:none}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);font-weight:700;border-top:2px solid var(--accent)}
.tab.add{font-weight:700;padding:6px 12px}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
input[type=text],select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 9px}
#status{margin-left:auto;color:var(--muted);font-size:12px}
#admin{display:none;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card)}
#admin textarea{width:100%;height:150px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;resize:vertical}
#admin .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
#msg{color:var(--accent);font-size:13px}
#view{flex:1;overflow:auto;position:relative;background:var(--bg)}
#empty{padding:40px;text-align:center;color:var(--muted)}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.m{position:absolute;height:40px;border:1px solid var(--border);border-radius:5px;background:var(--card);overflow:hidden}
.m.ko{border-style:dashed}
.s{height:19px;padding:0 6px;line-height:19px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.s + .s{border-top:1px solid var(--border)}
.s.can{cursor:pointer}
.s.can:hover{background:var(--accentbg)}
.s.empty{color:var(--muted)}
.s.win{background:var(--accentbg);color:var(--accent);font-weight:700}
.s.lose{color:var(--lose);text-decoration:line-through}
.s.hl{background:var(--hl);color:var(--fg)}
.lbl{position:absolute;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.champ{position:absolute;text-align:center;font-weight:700;padding:8px 6px;border:2px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent);font-size:13px}
.lbl.tog{cursor:pointer;user-select:none}
.lbl.tog:hover{color:var(--accent)}
.strip{position:absolute;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;user-select:none;white-space:nowrap}
.strip:hover{color:var(--accent);border-color:var(--accent)}
#board{display:none;flex:1;overflow:auto;padding:16px 20px;background:var(--bg)}
#boardNote{color:var(--muted);font-size:13px;margin-bottom:16px}
.tier{margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.tier h3{margin:0;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;font-size:15px}
.tier .rk{min-width:3.4em;color:var(--accent);font-size:18px;font-weight:800}
.tier .meta{color:var(--muted);font-size:12px;font-weight:400}
.tier ul{margin:8px 0 0;padding:0 0 0 20px;columns:260px;column-gap:24px;font-size:13px}
.tier li{break-inside:avoid;padding:1px 0}
.tier.top .rk{font-size:24px}
.tier.top li{font-size:17px;font-weight:600}
svg{position:absolute;left:0;top:0;pointer-events:none}
svg path{fill:none;stroke:var(--line);stroke-width:1.5}
svg path.done{stroke:var(--accent);stroke-width:2}
</style>
</head>
<body>

<nav id="tabs" role="tablist"></nav>

<header>
  <h1>Song Bracket</h1>
  <button id="zout" title="Zoom out">−</button>
  <button id="zin" title="Zoom in">+</button>
  <button id="gofinal">Go to final</button>
  <input type="text" id="search" placeholder="Find a song (Enter)">
  <button id="boardBtn">Leaderboard</button>
  <button id="adminBtn">Setup</button>
  <span id="status"></span>
</header>

<section id="admin">
  <div id="tools">
    <div id="setupFor" style="font-weight:600;margin-bottom:6px"></div>
    <div style="margin-bottom:6px;color:var(--muted)">Paste your songs, one per line (any number from 2 up). If the number isn't a power of two, a knockout stage trims the field first. Pairings are randomized when you create the bracket.</div>
    <textarea id="ta" placeholder="Song 1&#10;Song 2&#10;Song 3&#10;..."></textarea>
    <div class="row">
      <span id="count" style="color:var(--muted)">0 songs</span>
      <label>Odd sizes
        <select id="mode">
          <option value="byes">Allow byes</option>
          <option value="nobyes">No byes (everyone plays the knockout)</option>
        </select>
      </label>
      <label id="gLabel">Largest knockout group
        <select id="gsize"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
      </label>
      <label id="tLabel" style="display:none">Main bracket of
        <select id="tsize"></select>
      </label>
      <button id="create" class="primary">Create bracket</button>
      <button id="reshuffle">Re-shuffle pairings</button>
      <button id="resetPicks">Clear all picks</button>
      <button id="deleteTab">Delete this tab</button>
      <span id="msg"></span>
    </div>
    <div id="plan" style="margin-top:8px;color:var(--muted);font-size:13px"></div>
  </div>
</section>

<div id="view">
  <div id="empty">This bracket hasn't been created yet. Use Setup to paste in your songs.</div>
  <div id="sizer"><div id="canvas"></div></div>
</div>
<div id="board"><div id="boardList"></div></div>

<script>
/* ================= SETTINGS ================= */
const CONFIG = {
  // Your Firebase Realtime Database URL, no trailing slash. Example:
  // "https://my-bracket-default-rtdb.firebaseio.com"
  DB_URL: "https://songs-c0dcf-default-rtdb.firebaseio.com",
  PATH: "brackets",            // where the brackets live inside the database
  LEGACY_PATH: "bracket",      // where the old single-bracket version saved (copied over once)
  POLL_MS: 8000                // how often visitors check for updates
};
/* ============================================ */

const MIN_SONGS = 2, MAX_SONGS = 4096;
const COLLAPSED_W = 30, THIRD_DY = 100;
const MIN_W = 120, MAX_W = 200, G = 30, H = 40, TOP = 34, SLOT = 19, PAIR_GAP = 6, KO_GAP = 6;

let state = null;   // the open tab's record: {id, name, created, updated, seeds|null, gsize, picks, gpicks}
let S = null;       // structure derived from the number of songs
let KO = 0, COLW = [], COLX = [], CC = [], totalW = 0, totalH = 0;   // CC[c] = column c is minimised
let Y = [], gTop = [], gHgt = [];   // Y[r][i] = vertical centre of each main-bracket match
let dirty = false, editing = false, lastPick = null, boardOn = false, TOP4 = [];
let zoom = 0.8;
let hlName = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setStatus = t => { $('status').textContent = t; };

/* ---------- bracket structure ---------- */
// n songs, groups of at most m. The main bracket is the largest power of two <= n.
// Extra songs are cut in a knockout stage of small groups (each group's winner advances).
// main-bracket sizes T (powers of two, >= 2) for which n songs split into exactly T groups of 2-4 songs
function validTs(n){
  const out = [];
  for (let T = 2; 2 * T <= n; T *= 2) if (4 * T >= n) out.push(T);
  return out;
}
// no byes: every song plays in one of T knockout groups, sizes as even as possible
function buildNoBye(n, T){
  let R = 0;
  while ((1 << R) < T) R++;
  const base = Math.floor(n / T), extra = n % T;
  const sizes = [];
  for (let k = 0; k < T; k++) sizes.push(base + (Math.floor((k + 1) * extra / T) - Math.floor(k * extra / T)));
  const starts = [];
  let used = 0;
  for (const sz of sizes){ starts.push(used); used += sz; }
  const dest = sizes.map((_, k) => k);
  const slotSrc = dest.map(k => ({ g: k }));
  const seedLoc = new Array(n);
  sizes.forEach((sz, k) => { for (let mem = 0; mem < sz; mem++) seedLoc[starts[k] + mem] = { g: k, mem }; });
  return { n, m: 4, R, T, g: T, sizes, starts, dest, slotSrc, seedLoc, used: n, byes: 0 };
}
// n songs. Default: the main bracket is the largest power of two <= n and the extra songs are cut in
// a knockout stage of small groups (groups of at most m), the rest get byes.
function buildStruct(n, m, nb, tsz){
  if (nb && validTs(n).includes(tsz)) return buildNoBye(n, tsz);
  let R = 0;
  while ((2 << R) <= n) R++;
  const T = 1 << R;
  const sizes = [];
  let left = n - T;
  while (left > 0){
    const e = Math.min(m - 1, left);
    sizes.push(e + 1);
    left -= e;
  }
  const g = sizes.length;
  const starts = [];
  let used = 0;
  for (const sz of sizes){ starts.push(used); used += sz; }
  const dest = sizes.map((_, k) => Math.floor((k + 0.5) * T / g));   // main-bracket slot each group feeds
  const slotSrc = new Array(T);
  dest.forEach((s, k) => { slotSrc[s] = { g: k }; });
  const seedLoc = new Array(n);
  let nextBye = used;
  for (let s = 0; s < T; s++){
    if (!slotSrc[s]){ slotSrc[s] = { k: nextBye }; seedLoc[nextBye] = { s }; nextBye++; }
  }
  sizes.forEach((sz, k) => { for (let mem = 0; mem < sz; mem++) seedLoc[starts[k] + mem] = { g: k, mem }; });
  return { n, m, R, T, g, sizes, starts, dest, slotSrc, seedLoc, used, byes: n - used };
}
const hasB = () => !!(state && state.seeds);
function rebuild(){ S = hasB() ? buildStruct(state.seeds.length, state.gsize, state.nb, state.tsz) : null; }

function emptyPicks(Sx = S){
  const p = [];
  for (let r = 0; r < Sx.R; r++) p.push(new Array(Sx.T >> (r + 1)).fill(null));
  return p;
}
const emptyG = (Sx = S) => new Array(Sx.g).fill(null);

function applyNew(seeds, m, nb, tsz){
  state.seeds = seeds;
  state.gsize = m;
  state.nb = !!nb;
  state.tsz = nb ? tsz : 0;
  rebuild();
  state.picks = emptyPicks();
  state.gpicks = emptyG();
  state.third = null;
  syncSize();
}
function syncSize(){
  if (hasB()){
    $('gsize').value = String(state.gsize);
    $('mode').value = state.nb ? 'nobyes' : 'byes';
  }
  updatePlan(hasB() && state.nb ? state.tsz : undefined);
}

const encodePicks = rec => rec.picks.map(a => a.map(v => v === null ? '-' : v).join('')).join(',');
const encodeG = rec => rec.gpicks.map(v => v === null ? '-' : v).join('');

// turn what the database holds into a tab record
function decodeRec(id, d){
  const rec = { id, name: String(d.name || 'Bracket'), created: +d.created || 0, updated: +d.updated || 0, seeds: null, synced: true };
  const seeds = d.seeds ? String(d.seeds).split('\n') : null;
  if (seeds && seeds.length >= MIN_SONGS){
    rec.seeds = seeds;
    rec.gsize = [2, 3, 4].includes(+d.gsize) ? +d.gsize : 2;
    rec.nb = +d.nb === 1 && validTs(seeds.length).includes(+d.tsz);
    rec.tsz = rec.nb ? +d.tsz : 0;
    const Sx = buildStruct(seeds.length, rec.gsize, rec.nb, rec.tsz);
    const p = emptyPicks(Sx);
    const parts = String(d.picks || '').split(',');
    for (let r = 0; r < Sx.R; r++){
      const str = parts[r] || '';
      for (let i = 0; i < p[r].length; i++){
        const c = str[i];
        p[r][i] = (c === '0' || c === '1') ? Number(c) : null;
      }
    }
    rec.picks = p;
    const gp = emptyG(Sx);
    const gstr = String(d.gp || '');
    for (let k = 0; k < gp.length; k++){
      const c = Number(gstr[k]);
      gp[k] = (gstr[k] !== undefined && gstr[k] !== '-' && c >= 0 && c < Sx.sizes[k]) ? c : null;
    }
    rec.gpicks = gp;
    rec.third = (d.th === '0' || d.th === '1') && Sx.R >= 2 ? Number(d.th) : null;
  }
  return rec;
}
// the record as it is stored in the database
function recToDb(rec){
  const d = { name: rec.name, created: rec.created, updated: rec.updated };
  if (rec.seeds){
    d.seeds = rec.seeds.join('\n');
    d.gsize = rec.gsize;
    d.nb = rec.nb ? 1 : 0;
    d.tsz = rec.tsz || 0;
    d.picks = encodePicks(rec);
    d.gp = encodeG(rec);
    d.th = rec.third === 0 || rec.third === 1 ? String(rec.third) : '-';
  }
  return d;
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// the name sitting in slot j of match i in main round r (null if not decided yet)
// seed index of the song sitting in slot j of match i in main round r (null if not decided yet)
function entryIdx(r, i, j){
  if (r === 0){
    const src = S.slotSrc[2 * i + j];
    if (src.g === undefined) return src.k;
    const w = state.gpicks[src.g];
    return w === null ? null : S.starts[src.g] + w;
  }
  const feeder = 2 * i + j;
  const p = state.picks[r - 1][feeder];
  return p === null ? null : entryIdx(r - 1, feeder, p);
}
const entry = (r, i, j) => { const k = entryIdx(r, i, j); return k === null ? null : state.seeds[k]; };

// places 1 to 4 for the little scoreboard next to the champion (a place only shows once it is settled)
function top4(){
  const rows = S.R >= 2 ? 4 : 2;
  const { tiers } = standings();
  const out = [];
  for (let rk = 1; rk <= rows; rk++){
    const t = tiers.find(x => x.rank === rk && x.total === 1);
    out.push(t ? state.seeds[t.songs[0]] : null);
  }
  return out;
}

// 3rd place: the two semifinal losers play each other (needs at least a semifinal round)
function thirdIdx(j){
  const p = state.picks[S.R - 2][j];
  return p === null ? null : entryIdx(S.R - 2, j, 1 - p);
}
const thirdName = j => { const k = thirdIdx(j); return k === null ? null : state.seeds[k]; };
const thirdKey = () => S.R >= 2 ? JSON.stringify([thirdIdx(0), thirdIdx(1)]) : '';
function fixThird(before){ if (S.R >= 2 && thirdKey() !== before) state.third = null; }

/* ---------- layout ---------- */
const labelFor = r => {
  const e = S.T >> r;
  return e === 2 ? 'Final' : e === 4 ? 'Semifinals' : e === 8 ? 'Quarterfinals' : 'Round of ' + e;
};
const colLabel = c => (KO && c === 0) ? 'Knockout stage' : labelFor(c - KO);
const colKey = c => (KO && c === 0) ? 'ko' : String(c - KO);
const stripH = c => Math.round(44 + colLabel(c).length * 7);

// Minimised columns are a viewing preference: kept per tab in this browser only, never saved to the database.
let colState = {};
try { colState = JSON.parse(localStorage.getItem('bracket512-cols') || '{}') || {}; } catch (e) { colState = {}; }
const saveCols = () => { try { localStorage.setItem('bracket512-cols', JSON.stringify(colState)); } catch (e) {} };
const isColl = key => (colState[cur] || []).includes(String(key));
function toggleCol(key){
  key = String(key);
  const a = colState[cur] || (colState[cur] = []);
  const i = a.indexOf(key);
  if (i < 0) a.push(key); else a.splice(i, 1);
  saveCols();
  render();
}
function expandCol(key){
  const a = colState[cur];
  if (!a) return;
  const i = a.indexOf(String(key));
  if (i >= 0){ a.splice(i, 1); saveCols(); }
}
function resetCols(){ delete colState[cur]; saveCols(); }

function pos(r, i){
  return { x: COLX[r + KO], y: Y[r][i] };
}

let measureCtx = null;
function layout(){
  KO = S.g > 0 ? 1 : 0;
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  const fam = getComputedStyle(document.body).fontFamily;
  measureCtx.font = '700 11px ' + fam;
  const need = name => Math.min(MAX_W, Math.ceil(measureCtx.measureText(name).width) + 28);
  const lastC = S.R + KO;
  const nc = lastC + 2;   // rounds, then the champion, then the top-4 column
  TOP4 = top4();
  CC = [];
  for (let c = 0; c < lastC; c++) CC[c] = isColl(colKey(c));
  CC[lastC] = false;       // the champion and top-4 columns can't be minimised
  CC[lastC + 1] = false;
  COLW = new Array(nc).fill(MIN_W);
  if (KO && !CC[0]){
    for (let k = 0; k < S.used; k++) COLW[0] = Math.max(COLW[0], need(state.seeds[k]));
  }
  for (let r = 0; r < S.R; r++){
    if (CC[r + KO]) continue;
    const n = S.T >> (r + 1);
    for (let i = 0; i < n; i++){
      for (let j = 0; j < 2; j++){
        const name = entry(r, i, j);
        if (name !== null) COLW[r + KO] = Math.max(COLW[r + KO], need(name));
      }
    }
  }
  if (S.R >= 2 && !CC[lastC - 1]){   // the 3rd-place matchup sits under the final, so the final's column must fit its names
    for (let j = 0; j < 2; j++){
      const nm = thirdName(j);
      if (nm !== null) COLW[lastC - 1] = Math.max(COLW[lastC - 1], need(nm));
    }
  }
  for (const nm of TOP4) if (nm !== null) COLW[lastC + 1] = Math.max(COLW[lastC + 1], need(nm) + 34);
  const fp = state.picks[S.R - 1][0];
  const champ = fp === null ? null : entry(S.R - 1, 0, fp);
  if (champ !== null){
    measureCtx.font = '700 13px ' + fam;
    COLW[lastC] = Math.max(COLW[lastC], Math.min(MAX_W, Math.ceil(measureCtx.measureText(champ).width) + 44));
  }
  for (let c = 0; c < nc; c++) if (CC[c]) COLW[c] = COLLAPSED_W;
  let x = 0;
  COLX = [];
  for (let c = 0; c < nc; c++){ COLX[c] = x; x += COLW[c] + ((CC[c] && CC[c + 1]) ? 6 : G); }
  totalW = x - G;

  // vertical layout
  const P = H + PAIR_GAP;   // vertical pitch of first-round matches (box height + small gap)
  // minimised tabs get their own band above everything, so they never cover a match or a line
  let strip = 0;
  for (let c = 0; c < lastC; c++) if (CC[c]) strip = Math.max(strip, stripH(c));
  const top0 = strip ? Math.max(TOP, 6 + strip + 12) : TOP;
  const koVisible = KO === 1 && !CC[0];
  let r0 = 0;
  while (r0 < S.R && CC[r0 + KO]) r0++;   // first main round that is still open
  gHgt = S.sizes.map(sz => SLOT * sz + 2);
  gTop = [];
  Y = [];
  let bodyH;
  if (koVisible){
    // the knockout column sets the height and the main bracket is spread out to match it
    const MH = (S.T / 2) * P;
    const KH = gHgt.reduce((a, b) => a + b, 0) + KO_GAP * (S.g - 1);
    const stretch = KH > MH ? KH / MH : 1;
    bodyH = MH * stretch;
    let y = top0 + (bodyH - KH) / 2;
    for (let k = 0; k < S.g; k++){ gTop[k] = y; y += gHgt[k] + KO_GAP; }
    const gc = k => gTop[k] + gHgt[k] / 2;
    const allGroups = S.g === S.T;   // no byes: every main slot is fed by a group
    for (let r = 0; r < S.R; r++){
      const n = S.T >> (r + 1);
      Y[r] = [];
      for (let i = 0; i < n; i++){
        if (allGroups) Y[r][i] = r === 0 ? (gc(2 * i) + gc(2 * i + 1)) / 2 : (Y[r - 1][2 * i] + Y[r - 1][2 * i + 1]) / 2;
        else Y[r][i] = top0 + (i + 0.5) * P * stretch * (1 << r);
      }
    }
  } else {
    // minimised early rounds: the first open round takes the base spacing, which tightens every round after it
    bodyH = (r0 < S.R ? S.T >> (r0 + 1) : 1) * P;
    for (let r = 0; r < S.R; r++){
      const n = S.T >> (r + 1);
      Y[r] = [];
      for (let i = 0; i < n; i++) Y[r][i] = top0 + (i + 0.5) * P * Math.pow(2, r - r0);
    }
  }
  totalH = top0 + bodyH + 20;
  if (S.R >= 2 && !CC[lastC - 1]) totalH = Math.max(totalH, Y[S.R - 1][0] + THIRD_DY + H / 2 + 20);
  totalH = Math.max(totalH, Y[S.R - 1][0] - 20 + TOP4.length * SLOT + 2 + 20);
}

function render(){
  if (boardOn) renderBoard();
  const has = hasB();
  $('empty').style.display = has ? 'none' : 'block';
  $('sizer').style.display = has ? 'block' : 'none';
  if (!has) return;

  layout();
  const lastC = S.R + KO;
  const koVisible = KO === 1 && !CC[0];
  let r0 = 0;
  while (r0 < S.R && CC[r0 + KO]) r0++;
  let html = '';
  let svg = '';

  // column headers: click to minimise, click a minimised strip to bring it back
  for (let c = 0; c < lastC; c++){
    if (CC[c]){
      html += `<div class="strip" data-col="${colKey(c)}" style="left:${COLX[c]}px;width:${COLW[c]}px;top:6px;height:${stripH(c)}px" title="Click to expand">▸ ${colLabel(c)}</div>`;
    } else {
      html += `<div class="lbl tog" data-col="${colKey(c)}" style="left:${COLX[c]}px;width:${COLW[c]}px;top:6px" title="Click to minimize">▾ ${colLabel(c)}</div>`;
    }
  }
  html += `<div class="lbl" style="left:${COLX[lastC]}px;width:${COLW[lastC]}px;top:6px">Champion</div>`;

  const slotHtml = (name, cls, attrs) =>
    `<div class="${cls}" ${attrs} title="${name === null ? '' : esc(name)}">${name === null ? '—' : esc(name)}</div>`;

  // knockout groups
  if (koVisible){
    for (let k = 0; k < S.g; k++){
      const w = state.gpicks[k];
      let slots = '';
      for (let mem = 0; mem < S.sizes[k]; mem++){
        const sk = S.starts[k] + mem, name = state.seeds[sk];
        let cls = 's can';
        if (w === mem) cls += ' win'; else if (w !== null) cls += ' lose';
        if (hlName && name === hlName) cls += ' hl';
        slots += slotHtml(name, cls, `data-g="${k}" data-m="${mem}" data-k="${sk}"`);
      }
      html += `<div class="m ko" style="left:${COLX[0]}px;width:${COLW[0]}px;top:${gTop[k]}px;height:${gHgt[k]}px">${slots}</div>`;
      if (r0 < S.R){
        const s = S.dest[k];
        const x1 = COLX[0] + COLW[0];
        const y1 = gTop[k] + gHgt[k] / 2;   // leaves from the middle of the group
        const x2 = COLX[r0 + KO];
        const m0 = s >> 1;
        const jj = r0 === 0 ? (s & 1) : ((m0 >> (r0 - 1)) & 1);   // which slot of that match this group's winner takes
        const y2 = Y[r0][m0 >> r0] + (jj ? 9.5 : -9.5);
        const xm = (x1 + x2) / 2;
        svg += `<path class="${w !== null ? 'done' : ''}" d="M${x1} ${y1}C${xm} ${y1} ${xm} ${y2} ${x2} ${y2}"/>`;
      }
    }
  }

  // main bracket
  for (let r = 0; r < S.R; r++){
    if (CC[r + KO]) continue;
    let nv = r + 1;
    while (nv < S.R && CC[nv + KO]) nv++;   // next round that is still open
    const n = S.T >> (r + 1);
    for (let i = 0; i < n; i++){
      const p = pos(r, i);
      const picked = state.picks[r][i];
      let slots = '';
      for (let j = 0; j < 2; j++){
        const name = entry(r, i, j);
        let cls = 's';
        if (name !== null) cls += ' can'; else cls += ' empty';
        if (picked === j) cls += ' win'; else if (picked !== null) cls += ' lose';
        if (hlName && name === hlName) cls += ' hl';
        let attrs = `data-r="${r}" data-i="${i}" data-j="${j}"`;
        if (r === 0){
          const src = S.slotSrc[2 * i + j];
          if (src.g === undefined) attrs += ` data-k="${src.k}"`;
        }
        slots += slotHtml(name, cls, attrs);
      }
      html += `<div class="m" style="left:${p.x}px;width:${COLW[r + KO]}px;top:${p.y - H / 2}px">${slots}</div>`;

      if (nv < S.R){
        const jj = (i >> (nv - r - 1)) & 1;   // which slot of the later match this winner takes
        const qy = Y[nv][i >> (nv - r)] + (jj ? 9.5 : -9.5);
        const py = p.y;   // leaves from the middle of the matchup
        const x1 = p.x + COLW[r + KO], x2 = COLX[nv + KO], xm = (x1 + x2) / 2;
        svg += `<path class="${picked !== null ? 'done' : ''}" d="M${x1} ${py}H${xm}V${qy}H${x2}"/>`;
      }
    }
  }

  // champion
  const f = pos(S.R - 1, 0), fp = state.picks[S.R - 1][0];
  const champ = fp === null ? null : entry(S.R - 1, 0, fp);
  const cx = COLX[lastC];
  html += `<div class="champ" style="left:${cx}px;width:${COLW[lastC]}px;top:${f.y - 20}px;height:40px;line-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" title="${champ === null ? '' : esc(champ)}">${champ === null ? '—' : esc(champ)}</div>`;
  if (!CC[S.R - 1 + KO]) svg += `<path class="${fp !== null ? 'done' : ''}" d="M${f.x + COLW[S.R - 1 + KO]} ${f.y}H${cx}"/>`;

  // third-place matchup, under the final
  if (S.R >= 2 && !CC[lastC - 1]){
    const tx = COLX[lastC - 1], tw = COLW[lastC - 1], ty = f.y + THIRD_DY;
    html += `<div class="lbl" style="left:${tx}px;width:${tw}px;top:${ty - H / 2 - 20}px">3rd place</div>`;
    let tslots = '';
    for (let j = 0; j < 2; j++){
      const name = thirdName(j);
      let cls = name !== null ? 's can' : 's empty';
      if (state.third === j) cls += ' win'; else if (state.third !== null) cls += ' lose';
      if (hlName && name === hlName) cls += ' hl';
      tslots += slotHtml(name, cls, `data-third="1" data-j="${j}"`);
    }
    html += `<div class="m" style="left:${tx}px;width:${tw}px;top:${ty - H / 2}px">${tslots}</div>`;
  }

  // top 4, to the right of the champion
  const topC = lastC + 1;
  let t4 = '';
  TOP4.forEach((name, n) => {
    let cls = name === null ? 's empty' : 's';
    if (n === 0 && name !== null) cls += ' win';
    t4 += `<div class="${cls}" title="${name === null ? '' : esc(name)}"><b>${ordinal(n + 1)}</b>&nbsp; ${name === null ? '—' : esc(name)}</div>`;
  });
  html += `<div class="lbl" style="left:${COLX[topC]}px;width:${COLW[topC]}px;top:6px">Top ${TOP4.length}</div>`;
  html += `<div class="m" style="left:${COLX[topC]}px;width:${COLW[topC]}px;top:${f.y - 20}px;height:${TOP4.length * SLOT + 2}px">${t4}</div>`;

  $('canvas').innerHTML = `<svg width="${totalW}" height="${totalH}">${svg}</svg>` + html;
  applyZoom();
}

function applyZoom(){
  $('canvas').style.transform = `scale(${zoom})`;
  $('sizer').style.width = totalW * zoom + 'px';
  $('sizer').style.height = totalH * zoom + 'px';
}

/* ---------- picking ---------- */
// slot jj of match (r, i) just changed: clear any later pick that depended on it
function clearChain(r, i, jj){
  while (r < S.R){
    if (state.picks[r][i] === jj){ state.picks[r][i] = null; jj = i & 1; i >>= 1; r++; }
    else break;
  }
}
function pick(r, i, j){
  if (!hasB() || entry(r, i, j) === null) return false;
  if (state.picks[r][i] === j) return false;
  const tk = thirdKey();
  state.picks[r][i] = j;
  clearChain(r + 1, i >> 1, i & 1);
  fixThird(tk);
  save();
  render();
  return true;
}
function pickGroup(k, mem){
  if (state.gpicks[k] === mem) return false;
  const tk = thirdKey();
  state.gpicks[k] = mem;
  const s = S.dest[k];
  clearChain(0, s >> 1, s & 1);
  fixThird(tk);
  save();
  render();
  return true;
}
function pickThird(j){
  if (S.R < 2 || thirdName(j) === null || state.third === j) return false;
  state.third = j;
  save();
  render();
  return true;
}
// the winner of match (r, i) is gone, so any later pick that depended on it goes too (r = -1: a knockout group, i = its main slot)
function clearAbove(r, i){
  r++; i >>= 1;
  while (r < S.R && state.picks[r][i] !== null){ state.picks[r][i] = null; r++; i >>= 1; }
}
// right-click: take back the pick in that matchup
function deselect(el){
  if (!hasB()) return false;
  if (el.dataset.third !== undefined){
    if (state.third === null) return false;
    state.third = null;
  } else if (el.dataset.g !== undefined){
    const k = +el.dataset.g;
    if (state.gpicks[k] === null) return false;
    const tk = thirdKey();
    state.gpicks[k] = null;
    clearAbove(-1, S.dest[k]);
    fixThird(tk);
  } else {
    const r = +el.dataset.r, i = +el.dataset.i;
    if (state.picks[r][i] === null) return false;
    const tk = thirdKey();
    state.picks[r][i] = null;
    clearAbove(r, i);
    fixThird(tk);
  }
  save();
  render();
  return true;
}
const snapshot = () => ({ picks: JSON.parse(JSON.stringify(state.picks)), gpicks: state.gpicks.slice(), third: state.third });

$('canvas').addEventListener('click', e => {
  if (e.target.tagName === 'INPUT') return;
  const tg = e.target.closest('[data-col]');
  if (tg){ toggleCol(tg.dataset.col); return; }
  const el = e.target.closest('.s');
  if (!el) return;
  if (el.dataset.third !== undefined){ pickThird(+el.dataset.j); return; }
  if (el.dataset.r === undefined && el.dataset.g === undefined) return;
  const editable = el.dataset.k !== undefined;
  const before = editable ? snapshot() : null;
  let changed;
  if (el.dataset.g !== undefined) changed = pickGroup(+el.dataset.g, +el.dataset.m);
  else changed = pick(+el.dataset.r, +el.dataset.i, +el.dataset.j);
  if (editable && changed) lastPick = { k: +el.dataset.k, snap: before, time: Date.now() };
});

$('canvas').addEventListener('contextmenu', e => {
  if (e.target.tagName === 'INPUT') return;
  const el = e.target.closest('.s');
  if (!el || (el.dataset.r === undefined && el.dataset.g === undefined && el.dataset.third === undefined)) return;
  e.preventDefault();
  deselect(el);
});

// double-click a song in the first stage to edit it (and undo the pick the first click made)
$('canvas').addEventListener('dblclick', e => {
  if (e.target.tagName === 'INPUT') return;
  let el = e.target.closest('.s');
  if (!el || el.dataset.k === undefined) return;
  const k = +el.dataset.k;
  if (lastPick && lastPick.k === k && Date.now() - lastPick.time < 1000){
    state.picks = lastPick.snap.picks;
    state.gpicks = lastPick.snap.gpicks;
    state.third = lastPick.snap.third;
    lastPick = null;
    save();
    render();
    el = document.querySelector(`.s[data-k="${k}"]`);
  }
  if (el) startEdit(el, k);
});

function startEdit(el, k){
  editing = true;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = state.seeds[k];
  inp.style.cssText = 'width:100%;height:100%;border:0;padding:0 6px;font:inherit;font-size:11px;background:var(--card);color:var(--fg);outline:2px solid var(--accent)';
  el.textContent = '';
  el.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    editing = false;
    const v = inp.value.trim();
    if (commit && v && v !== state.seeds[k]){
      state.seeds[k] = v;
      save();
    }
    render();
  };
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') finish(true);
    else if (ev.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}

/* ---------- tabs, saving & loading ---------- */
const url = path => CONFIG.DB_URL.replace(/\/$/, '') + '/' + path + '.json';
const recUrl = id => url(CONFIG.PATH + '/' + id);
let store = {}, order = [], cur = null;   // all tabs by id, their display order, the open one
const pending = new Set();                // ids waiting to be written to the database
let saveTimer = null;

const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function sortOrder(){
  order = Object.keys(store).sort((a, b) => (store[a].created - store[b].created) || (a < b ? -1 : 1));
}
function ensureTab(){
  if (!Object.keys(store).length){
    store.main = { id: 'main', name: 'Bracket 1', created: 0, updated: 0, seeds: null };
  }
  sortOrder();
  if (!store[cur]) cur = order[0];
}
function finishLoad(){
  ensureTab();
  state = store[cur];
  rebuild();
  syncSize();
  renderTabs();
  render();
}

function persistLocal(){
  try { localStorage.setItem('brackets512', JSON.stringify({ cur, recs: store })); } catch (e) {}
}
function fixShape(r){
  if (!r.seeds || r.seeds.length < MIN_SONGS){ r.seeds = null; return r; }
  r.gsize = [2, 3, 4].includes(+r.gsize) ? +r.gsize : 2;
  r.nb = !!r.nb && validTs(r.seeds.length).includes(+r.tsz);
  r.tsz = r.nb ? +r.tsz : 0;
  const Sx = buildStruct(r.seeds.length, r.gsize, r.nb, r.tsz);
  if (!Array.isArray(r.picks) || r.picks.length !== Sx.R) r.picks = emptyPicks(Sx);
  if (!Array.isArray(r.gpicks) || r.gpicks.length !== Sx.g) r.gpicks = emptyG(Sx);
  r.third = (r.third === 0 || r.third === 1) && Sx.R >= 2 ? r.third : null;
  return r;
}
function loadLocalStore(){
  try {
    const s = localStorage.getItem('brackets512');
    if (s){
      const o = JSON.parse(s);
      for (const id of Object.keys(o.recs || {})){
        const r = o.recs[id];
        if (r && typeof r === 'object') store[id] = fixShape(Object.assign({ id, name: 'Bracket', created: 0, updated: 0 }, r));
      }
      cur = o.cur;
      return;
    }
    const old = localStorage.getItem('bracket512');   // the single-bracket version
    if (old){
      const o = JSON.parse(old);
      if (o && o.seeds) store.main = fixShape({ id: 'main', name: 'Bracket 1', created: 0, updated: o.updated || 0, seeds: o.seeds, gsize: o.gsize, picks: o.picks, gpicks: o.gpicks });
    }
  } catch (e) {}
}

function save(rec = state){
  rec.updated = Date.now();
  persistLocal();
  if (!CONFIG.DB_URL){ setStatus('Saved in this browser only (no database set)'); return; }
  pending.add(rec.id);
  dirty = true;
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushAll, 400);
}
async function pushAll(){
  let failed = false;
  for (const id of [...pending]){
    const rec = store[id];
    if (!rec){ pending.delete(id); continue; }
    const u = rec.updated;
    try {
      const res = await fetch(recUrl(id), { method: 'PUT', body: JSON.stringify(recToDb(rec)) });
      if (!res.ok) throw new Error(res.status);
      rec.synced = true;
      if (rec.updated === u) pending.delete(id);
    } catch (e){ failed = true; }
  }
  dirty = pending.size > 0;
  if (failed){
    setStatus('Save failed, retrying…');
    saveTimer = setTimeout(pushAll, 4000);
  } else if (!dirty){
    setStatus('Saved ✓ ' + new Date().toLocaleTimeString());
  }
}

// bring the database's version of the tabs into the page; returns true if anything changed
function mergeRemote(all){
  let changed = false;
  for (const id of Object.keys(all)){
    const d = all[id];
    if (!d || typeof d !== 'object') continue;
    const ex = store[id];
    if (!ex || ex.updated !== (+d.updated || 0) || ex.name !== String(d.name || 'Bracket')){
      if (id === cur && editing) continue;
      store[id] = decodeRec(id, d);
      changed = true;
    } else {
      ex.synced = true;
    }
  }
  for (const id of Object.keys(store)){
    if (!(id in all) && !pending.has(id)){ delete store[id]; changed = true; }
  }
  return changed;
}
async function pull(){
  if (!CONFIG.DB_URL) return;
  if (dirty || editing) return;
  try {
    const res = await fetch(url(CONFIG.PATH), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    let all = await res.json();
    if (all === null){
      // first run with tabs: copy over a bracket saved by the old single-bracket version
      const lr = await fetch(url(CONFIG.LEGACY_PATH), { cache: 'no-store' });
      const old = lr.ok ? await lr.json() : null;
      if (old && old.seeds){
        const moved = Object.assign({}, old, { name: 'Bracket 1', created: 0 });
        const pr = await fetch(recUrl('main'), { method: 'PUT', body: JSON.stringify(moved) });
        if (pr.ok) all = { main: moved };
      }
    }
    if (all && mergeRemote(all)) finishLoad();
    setStatus('Up to date ' + new Date().toLocaleTimeString());
  } catch (e){
    setStatus('Could not reach the database');
  }
}
async function init(){
  if (!CONFIG.DB_URL){
    loadLocalStore();
    finishLoad();
    setStatus('No database set: saving in this browser only');
    return;
  }
  setStatus('Loading…');
  await pull();
  finishLoad();
  setInterval(pull, CONFIG.POLL_MS);
}

/* ---------- tabs ---------- */
function renderTabs(){
  $('tabs').innerHTML = order.map(id =>
    `<div class="tab${id === cur ? ' on' : ''}" role="tab" tabindex="0" data-id="${id}" title="Double-click to rename">${esc(store[id].name)}</div>`
  ).join('') + `<div class="tab add" id="addTab" role="button" tabindex="0" title="New bracket">+</div>`;
  $('setupFor').textContent = 'Setup for: ' + store[cur].name;
  $('deleteTab').textContent = order.length > 1 ? 'Delete this tab' : 'Reset this tab';
}
function switchTab(id){
  if (!store[id] || id === cur) return;
  cur = id;
  state = store[id];
  rebuild();
  lastPick = null;
  hlName = null;
  $('msg').textContent = '';
  syncSize();
  renderTabs();
  render();
  $('view').scrollTo(0, 0);
  persistLocal();
}
function addTab(){
  const id = newId();
  const now = Date.now();
  store[id] = { id, name: 'Bracket ' + (order.length + 1), created: now, updated: now, seeds: null };
  sortOrder();
  switchTab(id);
  save(store[id]);
  $('admin').style.display = 'block';
}
function startRename(id){
  const b = document.querySelector(`#tabs .tab[data-id="${id}"]`);
  if (!b) return;
  editing = true;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.maxLength = 40;
  inp.value = store[id].name;
  inp.style.cssText = 'width:150px;border:0;padding:0;background:transparent;font:inherit;color:var(--fg);outline:2px solid var(--accent)';
  b.textContent = '';
  b.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    editing = false;
    const v = inp.value.trim();
    if (commit && v && v !== store[id].name){
      store[id].name = v;
      save(store[id]);
    }
    renderTabs();
  };
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') finish(true);
    else if (ev.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}
async function removeTab(id){
  const rec = store[id];
  if (order.length <= 1){
    // keep at least one tab so the database never ends up empty: just reset it
    rec.name = 'Bracket 1';
    rec.seeds = null;
    delete rec.picks; delete rec.gpicks; delete rec.gsize; delete rec.third;
    rebuild();
    save(rec);
    renderTabs();
    render();
    return;
  }
  if (CONFIG.DB_URL){
    try {
      const res = await fetch(recUrl(id), { method: 'DELETE' });
      if (!res.ok) throw new Error(res.status);
    } catch (e){ setStatus('Could not delete (database unreachable)'); return; }
  }
  const idx = order.indexOf(id);
  pending.delete(id);
  dirty = pending.size > 0;
  delete store[id];
  sortOrder();
  cur = order[Math.max(0, idx - 1)];
  state = store[cur];
  rebuild();
  lastPick = null;
  hlName = null;
  syncSize();
  persistLocal();
  renderTabs();
  render();
}

$('tabs').addEventListener('click', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.closest('#addTab')){ addTab(); return; }
  const b = e.target.closest('.tab[data-id]');
  if (b) switchTab(b.dataset.id);
});
$('tabs').addEventListener('dblclick', e => {
  if (e.target.tagName === 'INPUT') return;
  const b = e.target.closest('.tab[data-id]');
  if (b) startRename(b.dataset.id);
});
$('tabs').addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  if (e.target.id === 'addTab') addTab();
  else if (e.target.dataset && e.target.dataset.id) switchTab(e.target.dataset.id);
});

/* ---------- setup ---------- */
function parseLines(){
  return $('ta').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}
$('adminBtn').onclick = () => {
  const a = $('admin');
  a.style.display = a.style.display === 'block' ? 'none' : 'block';
};
const planN = () => { const n = parseLines().length; return n > 0 ? n : (hasB() ? state.seeds.length : 0); };
function mixText(b){
  const counts = {};
  b.sizes.forEach(sz => { counts[sz] = (counts[sz] || 0) + 1; });
  return Object.keys(counts).sort((x, y) => y - x).map(sz => `${counts[sz]} group${counts[sz] === 1 ? '' : 's'} of ${sz}`).join(', ');
}
function updatePlan(wanted){
  const nobyes = $('mode').value === 'nobyes';
  const m = +$('gsize').value;
  $('gLabel').style.display = nobyes ? 'none' : '';
  $('tLabel').style.display = nobyes ? '' : 'none';
  const typed = parseLines().length;
  $('count').textContent = typed + (typed === 1 ? ' song' : ' songs');
  $('count').style.color = typed >= MIN_SONGS ? 'var(--accent)' : 'var(--muted)';
  const n = planN();
  if (n < MIN_SONGS){ $('plan').textContent = ''; return; }
  let b;
  if (nobyes){
    const ts = validTs(n);
    if (!ts.length){
      $('tsize').innerHTML = '';
      $('plan').textContent = `"No byes" needs at least 4 songs (you have ${n}).`;
      return;
    }
    const want = wanted !== undefined ? +wanted : +$('tsize').value;
    const chosen = ts.includes(want) ? want : ts[ts.length - 1];
    $('tsize').innerHTML = ts.map(t => `<option value="${t}"${t === chosen ? ' selected' : ''}>${t} (${mixText(buildNoBye(n, t))})</option>`).join('');
    b = buildNoBye(n, chosen);
    const plain = b.sizes.every(sz => sz === 2) ? ' Groups of 2 are just a normal first round.' : '';
    $('plan').textContent = `${n} songs, no byes: every song plays in one of ${b.g} knockout groups (${mixText(b)}), and each group's winner advances to a main bracket of ${b.T}.${plain}`;
    return;
  }
  b = buildStruct(n, m);
  if (!b.g){
    $('plan').textContent = `${n} songs is a power of two: a straight ${b.T}-song bracket, no knockout stage.`;
    return;
  }
  $('plan').textContent = `${n} songs: main bracket of ${b.T}. ${b.used} songs play off in ${b.g} knockout groups (${mixText(b)}), and each group's winner advances. The other ${b.byes} get a bye.`;
}
// the setup controls, checked against a bracket of n songs
function readOpts(n){
  const nb = $('mode').value === 'nobyes';
  const ts = validTs(n);
  let tsz = +$('tsize').value;
  if (!ts.includes(tsz)) tsz = ts[ts.length - 1] || 0;
  return { m: +$('gsize').value, nb, ok: !nb || ts.length > 0, tsz };
}
$('ta').addEventListener('input', () => updatePlan());
$('gsize').addEventListener('change', () => updatePlan());
$('mode').addEventListener('change', () => updatePlan());
$('tsize').addEventListener('change', () => updatePlan());

let confirmCreate = false;
$('create').onclick = () => {
  const lines = parseLines();
  if (lines.length < MIN_SONGS || lines.length > MAX_SONGS){
    $('msg').textContent = `You pasted ${lines.length} songs. The bracket needs between ${MIN_SONGS} and ${MAX_SONGS}.`;
    return;
  }
  const opts = readOpts(lines.length);
  if (!opts.ok){
    $('msg').textContent = `"No byes" needs at least 4 songs (you pasted ${lines.length}).`;
    return;
  }
  if (hasB() && !confirmCreate){
    confirmCreate = true;
    $('create').textContent = 'Click again to replace the current bracket';
    $('msg').textContent = '';
    setTimeout(() => { confirmCreate = false; $('create').textContent = 'Create bracket'; }, 5000);
    return;
  }
  confirmCreate = false;
  $('create').textContent = 'Create bracket';
  applyNew(shuffle(lines), opts.m, opts.nb, opts.tsz);
  resetCols();
  hlName = null;
  $('msg').textContent = 'Bracket created.';
  save();
  render();
};
$('reshuffle').onclick = () => {
  if (!hasB()){ $('msg').textContent = 'Create a bracket first.'; return; }
  const opts = readOpts(state.seeds.length);
  if (!opts.ok){
    $('msg').textContent = `"No byes" needs at least 4 songs (this bracket has ${state.seeds.length}).`;
    return;
  }
  state.seeds = shuffle(state.seeds);
  state.gsize = opts.m;
  state.nb = opts.nb;
  state.tsz = opts.nb ? opts.tsz : 0;
  rebuild();
  resetCols();
  state.picks = emptyPicks();
  state.gpicks = emptyG();
  state.third = null;
  $('msg').textContent = 'Pairings re-shuffled and picks cleared.';
  save();
  render();
};
$('resetPicks').onclick = () => {
  if (!hasB()) return;
  state.picks = emptyPicks();
  state.gpicks = emptyG();
  state.third = null;
  $('msg').textContent = 'Picks cleared.';
  save();
  render();
};

let confirmDel = false;
$('deleteTab').onclick = () => {
  if (!confirmDel){
    confirmDel = true;
    $('deleteTab').textContent = 'Click again to confirm';
    setTimeout(() => { confirmDel = false; if (state) renderTabs(); }, 5000);
    return;
  }
  confirmDel = false;
  removeTab(cur);
};

/* ---------- leaderboard ---------- */
const ordinal = n => { const t = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (t[(v - 20) % 10] || t[v] || t[0]); };

// Everyone knocked out in the same round ties. A song's place only depends on the round it lost in, so it is final as soon as it is out.
function standings(){
  const rows = [];   // {idx, rank, why, total}
  const add = (idx, rank, why, total) => { if (idx !== null) rows.push({ idx, rank, why, total }); };
  for (let k = 0; k < S.g; k++){
    const w = state.gpicks[k];
    if (w === null) continue;
    for (let mem = 0; mem < S.sizes[k]; mem++){
      if (mem !== w) add(S.starts[k] + mem, S.T + 1, 'Lost in the knockout stage', S.n - S.T);
    }
  }
  for (let r = 0; r < S.R; r++){
    for (let i = 0; i < state.picks[r].length; i++){
      const p = state.picks[r][i];
      if (p === null) continue;
      const winner = entryIdx(r, i, p), loser = entryIdx(r, i, 1 - p);
      if (r === S.R - 1){
        add(winner, 1, 'Champion', 1);
        add(loser, 2, 'Runner-up', 1);
      } else if (r === S.R - 2){
        if (state.third === null) add(loser, 3, 'Lost in the semifinals', 2);
      } else {
        add(loser, 1 + (S.T >> (r + 1)), 'Lost in ' + labelFor(r), S.T >> (r + 1));
      }
    }
  }
  if (S.R >= 2 && state.third !== null){
    add(thirdIdx(state.third), 3, 'Won the 3rd-place match', 1);
    add(thirdIdx(1 - state.third), 4, 'Lost the 3rd-place match', 1);
  }
  const placed = new Set(rows.map(x => x.idx));
  const alive = [];
  for (let k = 0; k < S.n; k++) if (!placed.has(k)) alive.push(k);
  const map = new Map();
  for (const x of rows){
    const key = x.rank + '|' + x.why;
    if (!map.has(key)) map.set(key, { rank: x.rank, why: x.why, total: x.total, songs: [] });
    map.get(key).songs.push(x.idx);
  }
  const tiers = [...map.values()].sort((a, b) => a.rank - b.rank || (a.why < b.why ? -1 : 1));
  tiers.forEach(t => t.songs.sort((a, b) => a - b));
  return { tiers, alive };
}
function renderBoard(){
  const box = $('boardList');
  if (!hasB()){ box.innerHTML = '<div id="boardNote">No bracket has been created yet.</div>'; return; }
  const { tiers, alive } = standings();
  const li = k => `<li>${esc(state.seeds[k])}</li>`;
  const songs = n => n + (n === 1 ? ' song' : ' songs');
  let html = `<div id="boardNote">${S.n - alive.length} of ${S.n} songs placed so far. Songs knocked out in the same round are tied.</div>`;
  if (alive.length){
    html += `<section class="tier"><h3><span class="rk">—</span><span class="meta">${songs(alive.length)} · still in the running</span></h3><ul>${alive.map(li).join('')}</ul></section>`;
  }
  for (const t of tiers){
    const rk = (t.total > 1 ? 'T-' : '') + ordinal(t.rank);
    const count = t.songs.length < t.total ? `${t.songs.length} of ${t.total} songs` : songs(t.songs.length);
    html += `<section class="tier${t.rank <= 2 ? ' top' : ''}"><h3><span class="rk">${rk}</span><span class="meta">${t.total > 1 ? count + ' · ' : ''}${esc(t.why)}</span></h3><ul>${t.songs.map(li).join('')}</ul></section>`;
  }
  box.innerHTML = html;
}
$('boardBtn').onclick = () => {
  boardOn = !boardOn;
  $('view').style.display = boardOn ? 'none' : '';
  $('board').style.display = boardOn ? 'block' : 'none';
  $('boardBtn').textContent = boardOn ? 'Show bracket' : 'Leaderboard';
  if (boardOn) renderBoard();
};

/* ---------- toolbar ---------- */
$('zin').onclick = () => { zoom = Math.min(1.6, zoom + 0.1); applyZoom(); };
$('zout').onclick = () => { zoom = Math.max(0.2, zoom - 0.1); applyZoom(); };
$('gofinal').onclick = () => {
  if (!hasB()) return;
  const v = $('view'), p = pos(S.R - 1, 0);
  v.scrollTo({ left: (p.x + COLW[S.R - 1 + KO] / 2) * zoom - v.clientWidth / 2, top: p.y * zoom - v.clientHeight / 2, behavior: 'smooth' });
};
$('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !hasB()) return;
  const q = e.target.value.trim().toLowerCase();
  if (!q){ hlName = null; render(); return; }
  const k = state.seeds.findIndex(s => s.toLowerCase().includes(q));
  if (k < 0){ setStatus('No song matches that search.'); return; }
  hlName = state.seeds[k];
  expandCol(S.seedLoc[k].g !== undefined ? 'ko' : '0');
  render();
  const loc = S.seedLoc[k];
  const x = loc.g !== undefined ? COLX[0] : pos(0, loc.s >> 1).x;
  const y = loc.g !== undefined ? gTop[loc.g] + gHgt[loc.g] / 2 : pos(0, loc.s >> 1).y;
  const v = $('view');
  v.scrollTo({ left: x * zoom - 40, top: y * zoom - v.clientHeight / 2, behavior: 'smooth' });
});

init();
</script>
